  /** Static layered layout: BFS depth = column. Deterministic, no physics. */
  function depGraphCanvas(dep) {
    const wrap = el('div', {});
    const present = new Map(dep.nodes.map((n) => [n.uuid, n]));
    const links = dep.edges.filter((e) => e.to !== null && present.has(e.to) && present.has(e.from));

    // Legend + summary.
    const types = [...new Set(dep.nodes.map((n) => n.type))];
    wrap.append(el('div', { class: 'rel-legend' }, [
      el('span', { class: 'muted' }, [fmt(dep.nodes.length) + ' objects · ' + fmt(links.length) + ' references' + (dep.truncated ? ' · truncated at cap' : '')]),
      ...types.map((t) => el('span', { class: 'chip' }, [
        el('span', { class: 'dot', style: 'background:' + typeColor(t) }, []), t,
      ])),
    ]));

    // Layout: group by depth, sort within column by (type, name).
    const cols = [];
    for (const n of dep.nodes) (cols[n.depth] ??= []).push(n);
    for (const col of cols) if (col) col.sort((a, b) => cmpVals(a.type, b.type) || cmpVals(a.name, b.name));
    const COL_W = 280, ROW_H = 24, PAD = 30;
    const pos = new Map();
    let maxRows = 1;
    cols.forEach((col, d) => {
      if (!col) return;
      maxRows = Math.max(maxRows, col.length);
      col.forEach((n, i) => pos.set(n.uuid, { x: PAD + d * COL_W, y: PAD + i * ROW_H }));
    });
    const worldW = PAD * 2 + Math.max(1, cols.length) * COL_W;
    const worldH = PAD * 2 + maxRows * ROW_H;

    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + worldW + ' ' + worldH);
    const edgeLayer = document.createElementNS(NS, 'g');
    const nodeLayer = document.createElementNS(NS, 'g');
    svg.append(edgeLayer, nodeLayer);

    const tooltip = el('div', { class: 'tooltip', style: 'display:none' });
    const canvas = el('div', { class: 'rel-canvas' }, [svg, tooltip]);
    wrap.append(canvas);

    // Edges.
    const edgeEls = [];
    for (const e of links) {
      const a = pos.get(e.from), b = pos.get(e.to);
      const p = document.createElementNS(NS, 'path');
      const mx = (a.x + b.x) / 2;
      p.setAttribute('d', 'M' + (a.x + 8) + ',' + a.y + ' C' + mx + ',' + a.y + ' ' + mx + ',' + b.y + ' ' + (b.x - 8) + ',' + b.y);
      p.setAttribute('class', 'gedge');
      edgeLayer.append(p);
      edgeEls.push({ el: p, from: e.from, to: e.to, field: e.field });
    }

    // Nodes: dot + label.
    const infoBox = el('div', { class: 'node-info' });
    wrap.append(infoBox);
    for (const n of dep.nodes) {
      const { x, y } = pos.get(n.uuid);
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'gnode');
      g.setAttribute('transform', 'translate(' + x + ',' + y + ')');
      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('r', n.depth === 0 ? '8' : '5.5');
      dot.setAttribute('fill', typeColor(n.type));
      const label = document.createElementNS(NS, 'text');
      label.setAttribute('x', '12');
      label.setAttribute('y', '4');
      label.textContent = truncate(n.name ?? n.uuid, 30);
      if (n.depth === 0) label.setAttribute('font-weight', '700');
      g.append(dot, label);
      nodeLayer.append(g);

      g.addEventListener('mouseenter', (ev) => {
        for (const ee of edgeEls) {
          const touches = ee.from === n.uuid || ee.to === n.uuid;
          ee.el.setAttribute('class', 'gedge' + (touches ? ' hl' : ' dim'));
        }
        tooltip.style.display = 'block';
        tooltip.textContent = (n.name ?? n.uuid) + ' · ' + n.type + ' · depth ' + n.depth;
      });
      g.addEventListener('mousemove', (ev) => {
        const r = canvas.getBoundingClientRect();
        tooltip.style.left = Math.min(r.width - 200, ev.clientX - r.left + 12) + 'px';
        tooltip.style.top = (ev.clientY - r.top + 12) + 'px';
      });
      g.addEventListener('mouseleave', () => {
        for (const ee of edgeEls) ee.el.setAttribute('class', 'gedge');
        tooltip.style.display = 'none';
      });
      g.addEventListener('click', () => {
        infoBox.innerHTML = '';
        infoBox.append(el('div', { class: 'card' }, [
          el('b', {}, [n.name ?? n.uuid]), ' ', el('span', { class: 'muted' }, [n.type + ' · tenant ' + (n.tenant ?? '—')]),
          ' ', el('button', { class: 'btn', style: 'margin-left:10px', onclick: () => openObject(n.uuid) }, ['Open in Explorer']),
        ]));
      });
    }

    // Pan / zoom on the viewBox — no per-frame simulation, just a transform.
    let vb = { x: 0, y: 0, w: worldW, h: worldH };
    const applyVb = () => svg.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h);
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const scale = e.deltaY > 0 ? 1.15 : 1 / 1.15;
      const r = svg.getBoundingClientRect();
      const px = vb.x + ((e.clientX - r.left) / r.width) * vb.w;
      const py = vb.y + ((e.clientY - r.top) / r.height) * vb.h;
      vb = { x: px - (px - vb.x) * scale, y: py - (py - vb.y) * scale, w: vb.w * scale, h: vb.h * scale };
      applyVb();
    }, { passive: false });
    let panning = null;
    svg.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.gnode')) return;
      panning = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y };
      svg.classList.add('panning');
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!panning) return;
      const r = svg.getBoundingClientRect();
      vb.x = panning.vx - (e.clientX - panning.x) * (vb.w / r.width);
      vb.y = panning.vy - (e.clientY - panning.y) * (vb.h / r.height);
      applyVb();
    });
    svg.addEventListener('pointerup', () => { panning = null; svg.classList.remove('panning'); });
    return wrap;
  }

  // ---- hygiene ----
  function hygieneView() {

    const findings = shownRules.flatMap((r) => r.findings);

        capped.length > 0
          ? 'showing the first ' + fmt(findings.length) + ' examples; counts above are exact'
          : fmt(findings.length) + ' findings',
      ]),
    ]));

    const tbody = el('tbody', {}, pageFindings.map((f) => el('tr', {}, [
      el('td', {}, [el('span', { class: 'sev ' + f.severity }, [f.severity])]),
      el('td', { class: 'mono' }, [f.ruleId]),
      el('td', { class: 'name' }, [el('span', {
        class: 'edge-target', role: 'link', tabindex: '0',
        onclick: () => openObject(f.subject.uuid),
        onkeydown: (e) => { if (e.key === 'Enter') openObject(f.subject.uuid); },
      }, [f.subject.name ?? f.subject.uuid])]),
      el('td', { class: 'mono' }, [f.subject.type]),
      el('td', { style: 'white-space:normal; max-width:520px' }, [f.detail]),
    ])));
    if (pageFindings.length === 0) {
      tbody.append(el('tr', {}, [el('td', { colspan: '5', class: 'muted', style: 'padding:20px' }, ['No findings for this filter.'])]));
    }
    card.append(el('div', { class: 'table-scroll' }, [el('table', {}, [
      el('thead', {}, [el('tr', {}, ['Severity', 'Rule', 'Object', 'Type', 'Detail'].map((h) => el('th', { scope: 'col', style: 'cursor:default' }, [h])))]),
      tbody,
    ])]));
    card.append(el('div', { class: 'pager' }, [
      el('button', { class: 'btn', disabled: st.page === 0 ? '' : null, onclick: () => { st.page--; render(); } }, ['‹ Prev']),
      el('span', {}, ['Page ' + (st.page + 1) + ' / ' + pages]),
      el('button', { class: 'btn', disabled: st.page + 1 >= pages ? '' : null, onclick: () => { st.page++; render(); } }, ['Next ›']),
    ]));
    wrap.append(card);
    return wrap;
  }

  // ---- charts (plain SVG) ----
  function barsSvg(buckets) {
    const shown = buckets.slice(0, 12);
    const overflow = buckets.length - shown.length;
    const max = Math.max(1, ...shown.map((b) => b.count));
    const ROW = 22, LABEL_W = 120, W = 320;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    const H = shown.length * ROW + (overflow > 0 ? 18 : 0);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('style', 'width:100%; height:auto');
    shown.forEach((b, i) => {
      const y = i * ROW;
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', '0'); t.setAttribute('y', String(y + 14)); t.setAttribute('class', 'bar-label');
      t.textContent = truncate(b.key, 16);
      const title = document.createElementNS(NS, 'title');
      title.textContent = b.key + ': ' + fmt(b.count);
      t.append(title);
      const rect = document.createElementNS(NS, 'rect');
      const w = Math.max(2, (b.count / max) * (W - LABEL_W - 56));
      rect.setAttribute('x', String(LABEL_W)); rect.setAttribute('y', String(y + 4));
      rect.setAttribute('width', String(w)); rect.setAttribute('height', '14');
      rect.setAttribute('rx', '2'); rect.setAttribute('class', 'bar-rect');
      const c = document.createElementNS(NS, 'text');
      c.setAttribute('x', String(LABEL_W + w + 6)); c.setAttribute('y', String(y + 14)); c.setAttribute('class', 'bar-count');
      c.textContent = fmt(b.count);
      svg.append(t, rect, c);
    });
    if (overflow > 0) {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', '0'); t.setAttribute('y', String(shown.length * ROW + 12));
      t.setAttribute('class', 'bar-count');
      t.textContent = '… and ' + overflow + ' more';
      svg.append(t);
    }
    return svg;
  }

  /** Slice-and-dice treemap — proportional areas without a physics or layout lib. */
  function treemapSvg(buckets, onPick) {
    const W = 660, H = 300;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('style', 'width:100%; height:auto');
    const items = buckets.filter((b) => b.count > 0);
    const total = items.reduce((s, b) => s + b.count, 0);
    if (total === 0) return svg;

    // Recursive slice-and-dice: split the largest-remaining group off the long side.
    const place = (list, x, y, w, h, horiz) => {
      if (list.length === 0 || w < 1 || h < 1) return;
      if (list.length === 1) { draw(list[0], x, y, w, h); return; }
      const sum = list.reduce((s, b) => s + b.count, 0);
      let acc = 0, cut = 1;
      for (; cut < list.length; cut++) {
        acc += list[cut - 1].count;
        if (acc >= sum / 2) break;
      }
      const frac = acc / sum;
      if (horiz) {
        place(list.slice(0, cut), x, y, w * frac, h, w * frac < h);
        place(list.slice(cut), x + w * frac, y, w * (1 - frac), h, w * (1 - frac) < h);
      } else {
        place(list.slice(0, cut), x, y, w, h * frac, w < h * frac);
        place(list.slice(cut), x, y + h * frac, w, h * (1 - frac), w < h * (1 - frac));
      }
    };
    const PALETTE = ['#6366f1', '#0ea5e9', '#10b981', '#d97706', '#8b5cf6', '#ef4444', '#0d9488', '#f97316', '#64748b', '#a855f7', '#059669', '#e11d48'];
    let ci = 0;
    const colorOf = new Map();
    const draw = (b, x, y, w, h) => {
      if (!colorOf.has(b.key)) colorOf.set(b.key, TYPE_COLORS[b.key] ?? PALETTE[ci++ % PALETTE.length]);
      const g = document.createElementNS(NS, 'g');
      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', String(x)); rect.setAttribute('y', String(y));
      rect.setAttribute('width', String(Math.max(0, w))); rect.setAttribute('height', String(Math.max(0, h)));
      rect.setAttribute('fill', colorOf.get(b.key));
      rect.setAttribute('class', 'tm-rect');
      rect.setAttribute('role', 'button');
      rect.setAttribute('tabindex', '0');
      rect.setAttribute('aria-label', b.key + ', ' + fmt(b.count) + ' objects. Open in Explorer.');
      const title = document.createElementNS(NS, 'title');
      title.textContent = b.key + ': ' + fmt(b.count) + ' — click to explore';
      rect.append(title);
      rect.addEventListener('click', () => onPick(b.key));
      rect.addEventListener('keydown', (e) => { if (e.key === 'Enter') onPick(b.key); });
      g.append(rect);
      if (w > 70 && h > 26) {
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('x', String(x + 6)); t.setAttribute('y', String(y + 16));
        t.setAttribute('class', 'tm-label');
        // AA contrast: dark text on light fills, white on dark fills.
        t.setAttribute('fill', yiq(colorOf.get(b.key)) > 150 ? '#16202e' : '#ffffff');
        t.textContent = truncate(b.key, Math.floor(w / 7)) + ' (' + fmt(b.count) + ')';
        g.append(t);
      }
      svg.append(g);
    };
    place(items, 0, 0, W, H, W >= H);
    return svg;
  }

  // ---- JSON display ----
  function jsonPre(raw, node) {
    let text;
    try { text = JSON.stringify(JSON.parse(raw), null, 2); }
    catch { text = raw ?? ''; }
    const pre = el('pre', { class: 'json' });
    // Highlighting is a regex pass over the whole string; skip it past 2 MB
    // so one pathological object cannot stall the tab.
    if (text.length > 2_000_000) pre.textContent = text;
    else pre.innerHTML = highlight(text);
    return el('div', {}, [
      el('div', { class: 'k', style: 'margin-bottom:6px' }, ['Source object' + (node ? ' — ' + node.type : '')]),
      pre,
    ]);
  }

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function highlight(jsonText) {
    const json = esc(jsonText);
    const re = /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g;
    return json.replace(re, (match) => {
      let cls = 'tok-num';
      if (match[0] === '"') cls = /:$/.test(match) ? 'tok-key' : 'tok-str';
      else if (match === 'true' || match === 'false') cls = 'tok-bool';
      else if (match === 'null') cls = 'tok-null';
      return '<span class="' + cls + '">' + match + '</span>';
    });
  }

  // ---- tiny DOM + formatting helpers ----
  function el(tag, attrs = {}, children = []) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined) continue;
      if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (k === 'disabled' || k === 'selected' || k === 'hidden') { if (v !== false) node.setAttribute(k, ''); }
      else node.setAttribute(k, String(v));
    }
    for (const c of children) {
      if (c === '' || c === null || c === undefined) continue;
      node.append(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return node;
  }
  function renderCellVal(v) {
    if (v == null) return el('span', { class: 'faint' }, ['—']);
    if (v === 'true') return el('span', { class: 'bool-t' }, ['true']);
    if (v === 'false') return el('span', { class: 'bool-f' }, ['false']);
    return truncate(v, 40);
  }
  function cmpVals(a, b) {
    if (a == null && b == null) return 0;
    if (a == null) return 1; // nulls last
    if (b == null) return -1;
    const na = Number(a), nb = Number(b);
    if (!Number.isNaN(na) && !Number.isNaN(nb) && a !== '' && b !== '') return na - nb;
    return String(a).localeCompare(String(b));
  }
  function truncate(s, n) {
    s = String(s);
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  }
  function fmt(n) { return Number(n).toLocaleString(); }
  function fmtMB(n) { return (n / 1e6).toFixed(1) + ' MB'; }
  /** Perceived brightness (0-255) of a #rrggbb color. */
  function yiq(hex) {
    const n = parseInt(hex.slice(1), 16);
    return ((n >> 16 & 255) * 299 + (n >> 8 & 255) * 587 + (n & 255) * 114) / 1000;
  }

  render();
}
</script>
</body>
</html>
