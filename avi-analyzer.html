<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Avi (NSX ALB) Config Analyzer — single-file, zero-install, 100% client-side.

  Open this file directly (file://) in any modern browser. Drop a controller
  configuration export (the big JSON keyed by object type) onto the page.
  Nothing is uploaded anywhere: the Content-Security-Policy below makes network
  requests impossible, not merely absent.

  Architecture (all inline, in the <script type="module"> at the bottom):
    scanner  — streaming depth-counting slicer over File chunks; peak transient
               memory is O(largest single object), never O(file)
    refs     — single home for *_ref string parsing (uuid variants, #fragment,
               ?name= forms)
    graph    — lightweight node + resolved edge index (uuid-first, name fallback)
    dataset  — in-memory store: raw text slice per object, parsed on demand
    hygiene  — pure rules over (dataset, graph); exact counts, capped exemplars
    search   — inverted token index built once from the raw slices; queries
               scan only the vocabulary. Multi-term AND, exact totals, type
               facets, capped ranked results, field-aware snippets
    ui       — vanilla DOM; five views: Inventory / Explorer / Search /
               Relationships / Hygiene. No framework, no build step, no
               dependencies.

  Tests: tools/run under `node --test tools/tests/` — the harness extracts this
  file's module (marked id="app") and imports it; keep the exports stable.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Avi Config Analyzer</title>
<style>
  :root {
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;

    --bg: #eef1f6; --panel: #ffffff; --panel-2: #f6f8fb;
    --ink: #16202e; --muted: #55616e; --faint: #8a94a1;
    --line: #dbe2ea; --line-2: #eaeef4;
    --accent: #4f46e5; --accent-ink: #4338ca; --accent-bg: #eef2ff;
    --ok: #15803d; --warn: #b45309; --err: #b91c1c;
    --ok-bg: #dcfce7; --warn-bg: #fef3c7; --err-bg: #fee2e2; --info-bg: #e0f2fe; --info: #075985;
    --sel: #eef2ff;
    --tok-key: #4338ca; --tok-str: #15803d; --tok-num: #b45309; --tok-bool: #7c3aed; --tok-null: #8a94a1;
    --r: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1320; --panel: #151c2c; --panel-2: #1a2234;
      --ink: #e6ebf3; --muted: #a3aebc; --faint: #6d7889;
      --line: #2a3346; --line-2: #222b3d;
      --accent: #8b93f8; --accent-ink: #a5acff; --accent-bg: #232b4a;
      --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
      --ok-bg: #14321f; --warn-bg: #372a10; --err-bg: #3b1a1a; --info-bg: #12293b; --info: #7dd3fc;
      --sel: #232b4a;
      --tok-key: #a5acff; --tok-str: #4ade80; --tok-num: #fbbf24; --tok-bool: #c4b5fd; --tok-null: #6d7889;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 13px/1.45 var(--ui); color: var(--ink); background: var(--bg);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  code, .mono, pre { font-family: var(--mono); font-size: 12px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  header.top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header.top h1 { font-size: 15px; margin: 0; }
  header.top .pipeline { color: var(--muted); font-size: 12px; }
  header.top .pipeline b { color: var(--ink); font-weight: 600; }
  header.top .spacer { flex: 1; }

  .tabs { display: flex; gap: 2px; }
  .tab {
    border: 1px solid transparent; background: none; padding: 5px 12px; cursor: pointer;
    border-radius: var(--r); color: var(--muted);
  }
  .tab:hover { background: var(--panel-2); color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--accent-bg); color: var(--accent-ink); font-weight: 600; }

  .btn {
    border: 1px solid var(--line); background: var(--panel); border-radius: var(--r);
    padding: 5px 12px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  main { flex: 1; padding: 14px 16px; max-width: 1500px; width: 100%; margin: 0 auto; }
  footer.privacy {
    padding: 8px 16px; text-align: center; color: var(--muted); font-size: 12px;
    border-top: 1px solid var(--line);
  }
  footer.privacy .lock { color: var(--ok); font-weight: 600; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

  /* ---- upload / progress ---- */
  .center-col { max-width: 640px; margin: 8vh auto 0; display: flex; flex-direction: column; gap: 14px; }
  .dropzone {
    border: 2px dashed var(--line); border-radius: var(--r); padding: 48px 24px; text-align: center;
    cursor: pointer; background: var(--panel); width: 100%;
  }
  .dropzone.drag, .dropzone:hover { border-color: var(--accent); background: var(--accent-bg); }
  .dropzone .big { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .privacy-note {
    display: flex; gap: 8px; align-items: baseline; justify-content: center;
    color: var(--muted); font-size: 12px;
  }
  .progress-wrap { display: flex; flex-direction: column; gap: 8px; }
  .progress-bar { height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
  .progress-bar > div { height: 100%; background: var(--accent); width: 0%; }
  .error-box {
    background: var(--err-bg); color: var(--err); border: 1px solid var(--err);
    border-radius: var(--r); padding: 10px 12px;
  }
  .error-box details { color: var(--ink); margin-top: 6px; }
  .error-box summary { cursor: pointer; }

  /* ---- stats ---- */
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 14px; min-width: 90px; }
  .stat .v { font-size: 18px; font-weight: 650; margin-top: 2px; }
  .stat .v small { font-size: 11px; font-weight: 400; color: var(--muted); }
  .stat.clickable { cursor: pointer; }
  .stat.clickable:hover { border-color: var(--accent); }
  .stat.active { outline: 2px solid var(--accent); }

  /* ---- charts ---- */
  .charts { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
  @media (max-width: 1000px) { .charts { grid-template-columns: 1fr; } }
  .chart-card h3 { margin: 0 0 8px; font-size: 13px; }
  .chart-card svg text { font-family: var(--ui); }
  .bar-label { fill: var(--ink); font-size: 11px; }
  .bar-count { fill: var(--muted); font-size: 11px; }
  .bar-rect { fill: var(--accent); opacity: .75; }
  .tm-rect { stroke: var(--panel); stroke-width: 1.5; cursor: pointer; }
  .tm-rect:hover { opacity: .8; }
  .tm-label { font-size: 11px; pointer-events: none; }

  /* ---- two-pane layouts ---- */
  .split { display: grid; grid-template-columns: 240px 1fr; gap: 12px; align-items: start; }
  .side-list { max-height: 76vh; overflow: auto; padding: 8px; }
  .side-list .item {
    padding: 4px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px;
  }
  .side-list .item:hover { background: var(--panel-2); }
  .side-list .item.sel { background: var(--sel); color: var(--accent-ink); font-weight: 600; }
  .side-list input[type="search"] { margin-bottom: 8px; }

  input[type="search"], select {
    width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--ink); font: inherit;
  }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .toolbar input[type="search"] { max-width: 320px; }

  /* ---- tables ---- */
  .table-scroll { overflow: auto; max-height: 66vh; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  th {
    position: sticky; top: 0; background: var(--panel); z-index: 1; font-size: 11px;
    text-transform: uppercase; letter-spacing: .04em; color: var(--muted); cursor: pointer; user-select: none;
  }
  th:hover { color: var(--accent-ink); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--panel-2); }
  td.name { font-weight: 600; }
  .bool-t { color: var(--ok); } .bool-f { color: var(--err); }
  .pager { display: flex; gap: 12px; align-items: center; justify-content: flex-end; padding-top: 8px; }

  .detail-row td { background: var(--panel-2); white-space: normal; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 6px 2px; }
  @media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
  .edge-line { margin-bottom: 3px; }
  .edge-field { color: var(--tok-key); font-family: var(--mono); font-size: 12px; }
  .edge-target { cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); }
  .edge-target:hover { color: var(--accent-ink); }
  .edge-dangling { color: var(--err); }
  pre.json { margin: 0; max-height: 420px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; white-space: pre; }
  .tok-key { color: var(--tok-key); } .tok-str { color: var(--tok-str); }
  .tok-num { color: var(--tok-num); } .tok-bool { color: var(--tok-bool); } .tok-null { color: var(--tok-null); }

  /* ---- global search ---- */
  .search-head { max-width: 720px; margin: 4px auto 16px; }
  .search-head input { font-size: 15px; padding: 10px 16px; border-radius: 22px; }
  .search-hint { text-align: center; }
  .search-status { max-width: 860px; margin: 0 auto 10px; }
  .result { max-width: 860px; margin: 0 auto 10px; }
  .result-title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
  .result-title .edge-target { font-weight: 600; font-size: 14px; }
  .result-type { background: var(--accent-bg); color: var(--accent-ink); border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  .snippet { color: var(--muted); white-space: normal; overflow-wrap: anywhere; margin-bottom: 2px; }
  mark.hl { background: var(--warn-bg); color: var(--ink); font-weight: 650; padding: 0 1px; border-radius: 2px; }
  .facets { display: flex; gap: 6px; flex-wrap: wrap; max-width: 860px; margin: 0 auto 10px; }
  .facet {
    border: 1px solid var(--line); background: var(--panel); border-radius: 14px;
    padding: 2px 10px; cursor: pointer; font-size: 12px; color: var(--muted);
  }
  .facet:hover { border-color: var(--accent); color: var(--accent-ink); }
  .facet.active { background: var(--accent-bg); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .assoc { margin-top: 4px; font-size: 12px; }
  .assoc .k2 { color: var(--faint); text-transform: uppercase; font-size: 10px; letter-spacing: .05em; margin-right: 4px; }

  /* ---- severity ---- */
  .sev { padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .sev.critical { background: var(--err-bg); color: var(--err); }
  .sev.warning { background: var(--warn-bg); color: var(--warn); }
  .sev.info { background: var(--info-bg); color: var(--info); }

  /* ---- relationship graph ---- */
  .rel-canvas { position: relative; overflow: hidden; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel-2); height: 70vh; }
  .rel-canvas svg { display: block; width: 100%; height: 100%; cursor: grab; }
  .rel-canvas svg.panning { cursor: grabbing; }
  .rel-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; }
  .rel-legend .chip { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .rel-legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .gnode { cursor: pointer; }
  .gnode text { fill: var(--ink); font-size: 11px; }
  .gnode.dim { opacity: .25; }
  .gedge { stroke: var(--faint); stroke-width: 1.1; fill: none; opacity: .45; }
  .gedge.hl { stroke: var(--accent); opacity: 1; stroke-width: 1.8; }
  .gedge.dim { opacity: .08; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.18);
    max-width: 340px; z-index: 5; white-space: nowrap;
  }
  .node-info { margin-top: 8px; }
</style>
</head>
<body>
  <header class="top" id="topbar">
    <h1>Avi Config Analyzer</h1>
    <span class="pipeline" id="pipeline">No configuration loaded</span>
    <span class="spacer"></span>
    <div class="tabs" role="tablist" id="tabs" hidden>
      <button class="tab" role="tab" data-view="inventory" aria-selected="true">Inventory</button>
      <button class="tab" role="tab" data-view="explorer" aria-selected="false">Explorer</button>
      <button class="tab" role="tab" data-view="search" aria-selected="false">Search</button>
      <button class="tab" role="tab" data-view="relationships" aria-selected="false">Relationships</button>
      <button class="tab" role="tab" data-view="hygiene" aria-selected="false">Hygiene</button>
    </div>
    <button class="btn" id="btn-new" hidden>Load another file</button>
  </header>

  <main id="main"></main>

  <footer class="privacy">
    <span class="lock">&#128274;</span>
    All processing happens locally in this browser tab. This page cannot make network
    requests &mdash; blocked by its Content-Security-Policy &mdash; so your configuration never leaves this machine.
  </footer>

<script type="module" id="app">
/* eslint-disable */
'use strict';

// ======================================================================
// refs — the single home for *_ref string parsing. (Port of shared/refs.ts.)
// ======================================================================

const API_PATH = /\/api\/([a-z0-9_]+)\/([^/?#]+)/i;

export function parseRef(ref) {
  if (typeof ref !== 'string') return null;
  const raw = ref.trim();
  if (raw === '') return null;

  let objectType, uuid, name, tenant, cloud;

  const pathMatch = raw.match(API_PATH);
  if (pathMatch) {
    objectType = pathMatch[1].toLowerCase();
    uuid = decodeSegment(pathMatch[2]);
  }
  const hashIdx = raw.indexOf('#');
  if (hashIdx !== -1) {
    const frag = raw.slice(hashIdx + 1);
    if (frag !== '') name = decodeSegment(frag);
  }
  const qIdx = raw.indexOf('?');
  if (qIdx !== -1) {
    const qs = hashIdx !== -1 && hashIdx > qIdx ? raw.slice(qIdx + 1, hashIdx) : raw.slice(qIdx + 1);
    for (const pair of qs.split('&')) {
      const eq = pair.indexOf('=');
      if (eq === -1) continue;
      const key = pair.slice(0, eq);
      const val = decodeSegment(pair.slice(eq + 1));
      if (val === '') continue;
      if (key === 'name') name = val;
      else if (key === 'tenant') tenant = val;
      else if (key === 'cloud') cloud = val;
    }
  }
  if (!pathMatch && name === undefined && qIdx === -1 && hashIdx === -1) name = raw;

  const out = { raw };
  if (objectType !== undefined) out.objectType = objectType;
  if (uuid !== undefined) out.uuid = uuid;
  if (name !== undefined) out.name = name;
  if (tenant !== undefined) out.tenant = tenant;
  if (cloud !== undefined) out.cloud = cloud;
  return out;
}

/** Display name for a ref; falls back to uuid, then the raw string. */
export function refName(ref) {
  const parsed = parseRef(ref);
  if (!parsed) return '';
  return parsed.name ?? parsed.uuid ?? parsed.raw;
}

/**
 * Avi uuids are type-prefixed ("pool-<uuid>"). Return the id plus its
 * prefix-stripped variant so the resolver matches either convention.
 * ASSUMPTION: the prefix is a type token (letters) followed by one '-'.
 */
export function uuidVariants(id) {
  const variants = [id];
  const dash = id.indexOf('-');
  if (dash > 0 && /^[a-z][a-z0-9_]*$/i.test(id.slice(0, dash))) variants.push(id.slice(dash + 1));
  return variants;
}

export function isRefKey(key) {
  return key === 'ref' || key.endsWith('_ref') || key.endsWith('_refs');
}

function decodeSegment(s) {
  try { return decodeURIComponent(s); } catch { return s; }
}

// ======================================================================
// avi — open object model accessors. (Port of shared/avi-types.ts.)
// ======================================================================

export function getString(o, key) {
  const v = o[key];
  return typeof v === 'string' ? v : undefined;
}
export function getBool(o, key) {
  const v = o[key];
  return typeof v === 'boolean' ? v : undefined;
}
export function isScalar(v) {
  return v === null || typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean';
}
/** Identified (worth indexing) = carries a name or uuid. */
export function hasIdentity(o) {
  if (o === null || typeof o !== 'object' || Array.isArray(o)) return false;
  const n = o.name, u = o.uuid;
  const nOk = typeof n === 'string' ? n.trim() !== '' : n != null;
  const uOk = typeof u === 'string' ? u.trim() !== '' : u != null;
  return nOk || uOk;
}

// ======================================================================
// scanner — streaming depth-counting slicer.
//
// The export is one large JSON object: { "VirtualService": [ {...}, ... ],
// "META": {...} }. We must never JSON.parse the whole file (a 200 MB dump
// balloons to multi-GB of live objects). Instead: scan the byte stream,
// depth-count to find each array element's exact character range, and hand
// that SLICE to native JSON.parse. Native parse runs at ~350 MB/s vs ~43 MB/s
// for a JS tokenizer (measured), and transient memory stays O(largest object).
// The raw slice is also kept per object (see Dataset) — serialization for free.
//
// Intentional degradations (documented, not accidental):
//  - scalar array elements are skipped (they carry no identity; the previous
//    pipeline emitted then discarded them),
//  - top-level scalar values are ignored (META is always an object in practice).
// ======================================================================

export class ConfigScanner {
  /** handlers: { onObject(type, obj, rawSlice), onMeta(key, value) } */
  constructor(handlers) {
    this.h = handlers;
    this.buf = '';
    this.scanFrom = 0;       // index in buf we have scanned up to
    this.baseOffset = 0;     // absolute char offset of buf[0] (for error messages)
    this.depth = 0;
    this.inStr = false;
    this.esc = false;
    this.rootOpened = false;
    this.inArray = false;    // inside a top-level type array
    this.arrayType = null;
    this.lastKey = null;     // last string seen at depth 1 (candidate key)
    this.pendingKey = null;  // key whose value we are expecting
    this.expectValue = false;
    this.keyBuf = '';        // accumulates depth-1 strings across chunks
    this.keyOverflow = false;
    this.sliceStart = -1;    // start of the element / meta slice being captured
    this.sliceMode = null;   // 'elem' | 'meta'
  }

  feed(text) {
    this.buf += text;
    const buf = this.buf;
    let i = this.scanFrom;
    for (; i < buf.length; i++) {
      const c = buf.charCodeAt(i);

      if (this.inStr) {
        if (this.esc) this.esc = false;
        else if (c === 92 /* \ */) this.esc = true;
        else if (c === 34 /* " */) {
          this.inStr = false;
          if (this.depth === 1 && this.sliceStart < 0) this.closeTopString();
        } else if (this.depth === 1 && this.sliceStart < 0 && !this.keyOverflow) {
          if (this.keyBuf.length < 4096) this.keyBuf += buf[i];
          else this.keyOverflow = true;
        }
        continue;
      }

      switch (c) {
        case 34: /* " */
          this.inStr = true;
          if (this.depth === 1 && this.sliceStart < 0) { this.keyBuf = ''; this.keyOverflow = false; }
          break;
        case 123: /* { */
          if (this.depth === 0) {
            this.rootOpened = true;
          } else if (this.depth === 1 && this.expectValue && this.sliceStart < 0) {
            this.sliceStart = i; this.sliceMode = 'meta'; this.expectValue = false;
          } else if (this.depth === 2 && this.inArray && this.sliceStart < 0) {
            this.sliceStart = i; this.sliceMode = 'elem';
          }
          this.depth++;
          break;
        case 91: /* [ */
          if (this.depth === 0) this.fail(i, 'file is a JSON array — expected an Avi export shaped like {"VirtualService": [...], ...}');
          if (this.depth === 1 && this.expectValue && this.sliceStart < 0) {
            this.inArray = true; this.arrayType = this.pendingKey; this.expectValue = false;
          }
          this.depth++;
          break;
        case 125: /* } */
        case 93: /* ] */
          this.depth--;
          if (this.depth < 0) this.fail(i, 'unbalanced brackets');
          if (this.sliceStart >= 0) {
            if (this.sliceMode === 'elem' && this.depth === 2 && c === 125) this.emitElem(i);
            else if (this.sliceMode === 'meta' && this.depth === 1) this.emitMeta(i);
          }
          if (c === 93 && this.inArray && this.depth === 1) { this.inArray = false; this.arrayType = null; }
          break;
        case 58: /* : */
          if (this.depth === 1 && this.sliceStart < 0) {
            this.pendingKey = this.lastKey; this.expectValue = true;
          }
          break;
        case 44: /* , */
          // A top-level scalar we did not capture (number/bool/null) ends here;
          // clear expectValue so the next string is read as a key, not a value.
          if (this.depth === 1 && this.sliceStart < 0) this.expectValue = false;
          break;
        default:
          if (this.depth === 0 && !this.rootOpened && c > 32 && c !== 0xfeff) {
            this.fail(i, 'file does not start with a JSON object — expected an Avi export shaped like {"VirtualService": [...], ...}');
          }
      }
    }
    // Trim consumed input; keep only an unfinished slice (or nothing).
    if (this.sliceStart >= 0) {
      this.baseOffset += this.sliceStart;
      this.buf = buf.slice(this.sliceStart);
      this.sliceStart = 0;
      this.scanFrom = this.buf.length;
    } else {
      this.baseOffset += buf.length;
      this.buf = '';
      this.scanFrom = 0;
    }
  }

  end() {
    if (!this.rootOpened) this.fail(0, 'file is empty or not JSON');
    if (this.depth !== 0 || this.inStr || this.sliceStart >= 0) this.fail(this.buf.length, 'unexpected end of file (truncated export?)');
  }

  closeTopString() {
    const key = this.keyOverflow ? null : this.decodeKey(this.keyBuf);
    if (this.expectValue) {
      // Top-level scalar string value — ignored (see header note).
      this.expectValue = false;
    } else {
      this.lastKey = key;
    }
  }

  decodeKey(raw) {
    if (!raw.includes('\\')) return raw;
    try { return JSON.parse('"' + raw + '"'); } catch { return raw; }
  }

  emitElem(i) {
    const slice = this.buf.slice(this.sliceStart, i + 1);
    this.sliceStart = -1; this.sliceMode = null;
    let obj;
    try { obj = JSON.parse(slice); }
    catch (e) { this.fail(i, 'malformed object in "' + this.arrayType + '": ' + e.message); }
    this.h.onObject(this.arrayType, obj, slice);
  }

  emitMeta(i) {
    const slice = this.buf.slice(this.sliceStart, i + 1);
    const key = this.pendingKey;
    this.sliceStart = -1; this.sliceMode = null; this.pendingKey = null;
    let value;
    try { value = JSON.parse(slice); }
    catch (e) { this.fail(i, 'malformed value for "' + key + '": ' + e.message); }
    if (key != null && this.h.onMeta) this.h.onMeta(key, value);
  }

  fail(i, msg) {
    const err = new Error(msg);
    err.offset = this.baseOffset + i;
    throw err;
  }
}

/**
 * Parse a Blob/File through ConfigScanner. Reads via blob.stream(), so each
 * chunk await yields to the event loop and progress can paint. onProgress is
 * called with (bytesRead, totalBytes) at most every ~80 ms.
 */
export async function scanBlob(blob, handlers, onProgress) {
  const scanner = new ConfigScanner(handlers);
  const reader = blob.stream().getReader();
  const decoder = new TextDecoder();
  let read = 0;
  let lastTick = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    read += value.byteLength;
    scanner.feed(decoder.decode(value, { stream: true }));
    const now = Date.now();
    if (onProgress && (now - lastTick > 80 || read === blob.size)) {
      lastTick = now;
      onProgress(read, blob.size);
    }
  }
  const tail = decoder.decode();
  if (tail) scanner.feed(tail);
  scanner.end();
}

// ======================================================================
// graph — lightweight nodes + resolved edges. (Port of server/ref-graph.ts;
// the unreachable anonymous-id branch is gone: hasIdentity gates addObject.)
// ======================================================================

const SEP = '␀';
const MAX_GRAPH_NODES = 2000;
const MAX_GRAPH_DEPTH = 12;

export class RefGraph {
  constructor() {
    this.nodes = new Map();       // canonical uuid -> {uuid,type,name,tenant,cloud}
    this.byUuid = new Map();      // every uuid variant -> canonical
    this.byTypeName = new Map();  // type\0name -> canonical (first writer wins)
    this.byType = new Map();      // type -> canonical uuids
    this.pendingEdges = [];
    this.outgoing = new Map();
    this.incoming = new Map();
    this.danglingList = [];
    this.edgeCount = 0;
    this.danglingCount = 0;
    this.resolved = false;
  }

  get size() { return this.nodes.size; }
  get edges() { return this.edgeCount; }
  get dangling() { return this.danglingCount; }

  /** Phase 1: register an object; stash raw edge specs. Returns canonical uuid or null. */
  addObject(type, obj) {
    if (!hasIdentity(obj)) return null;
    const uuidField = getString(obj, 'uuid');
    const name = getString(obj, 'name') ?? null;
    const canonical = uuidField ?? type + ':name:' + name;

    const node = {
      uuid: canonical, type, name,
      tenant: refName(obj.tenant_ref) || null,
      cloud: refName(obj.cloud_ref) || null,
    };
    const isNew = !this.nodes.has(canonical);
    this.nodes.set(canonical, node);

    if (uuidField) for (const v of uuidVariants(uuidField)) this.byUuid.set(v, canonical);
    this.byUuid.set(canonical, canonical);
    if (name) {
      const key = type.toLowerCase() + SEP + name;
      if (!this.byTypeName.has(key)) this.byTypeName.set(key, canonical);
    }
    if (isNew) {
      const list = this.byType.get(type);
      if (list) list.push(canonical); else this.byType.set(type, [canonical]);
    }

    collectRefs(obj, '', (field, refStr) => {
      const parsed = parseRef(refStr);
      if (!parsed) return;
      this.pendingEdges.push({
        from: canonical, field,
        refName: parsed.name ?? null,
        targetUuid: parsed.uuid,
        targetType: parsed.objectType,
        targetName: parsed.name,
      });
    });
    return canonical;
  }

  /** Phase 2: resolve all stashed edges, uuid-first with type+name fallback. */
  resolve() {
    if (this.resolved) return;
    for (const spec of this.pendingEdges) {
      let to = null, resolvedBy = 'none';
      if (spec.targetUuid !== undefined) {
        for (const v of uuidVariants(spec.targetUuid)) {
          const hit = this.byUuid.get(v);
          if (hit !== undefined) { to = hit; resolvedBy = 'uuid'; break; }
        }
      }
      if (to === null && spec.targetType !== undefined && spec.targetName !== undefined) {
        const hit = this.byTypeName.get(spec.targetType.toLowerCase() + SEP + spec.targetName);
        if (hit !== undefined) { to = hit; resolvedBy = 'name'; }
      }
      const edge = { field: spec.field, from: spec.from, to, refName: spec.refName, resolvedBy };
      pushEdge(this.outgoing, spec.from, edge);
      if (to !== null) pushEdge(this.incoming, to, edge);
      else { this.danglingList.push(edge); this.danglingCount++; }
      this.edgeCount++;
    }
    this.pendingEdges.length = 0;
    this.resolved = true;
  }

  canonicalize(uuid) {
    if (this.nodes.has(uuid)) return uuid;
    return this.byUuid.get(uuid);
  }
  getNode(uuid) {
    const c = this.canonicalize(uuid);
    return c === undefined ? null : (this.nodes.get(c) ?? null);
  }
  outgoingOf(uuid) {
    const c = this.canonicalize(uuid);
    return (c && this.outgoing.get(c)) || [];
  }
  incomingOf(uuid) {
    const c = this.canonicalize(uuid);
    return (c && this.incoming.get(c)) || [];
  }
  orphansOfType(type) {
    const out = [];
    for (const uuid of this.byType.get(type) ?? []) {
      const node = this.nodes.get(uuid);
      if (node && this.incomingOf(uuid).length === 0) out.push(node);
    }
    return out;
  }
  allOfType(type) {
    const out = [];
    for (const uuid of this.byType.get(type) ?? []) {
      const node = this.nodes.get(uuid);
      if (node) out.push(node);
    }
    return out;
  }
  danglingEdges() { return this.danglingList; }

  /** Object types present, largest first. */
  types() {
    const out = [];
    for (const [type, list] of this.byType) out.push({ key: type, count: list.length });
    out.sort((a, b) => b.count - a.count || a.key.localeCompare(b.key));
    return out;
  }

  /**
   * BFS dependency chain from rootUuid over outgoing edges; depth- and
   * size-capped so a pathological graph cannot produce an unbounded result.
   */
  dependencyGraph(rootUuid, maxDepth = MAX_GRAPH_DEPTH) {
    const root = this.canonicalize(rootUuid);
    if (root === undefined) return null;
    const depthOf = new Map([[root, 0]]);
    const nodesOut = [];
    const edgesOut = [];
    const queue = [root];
    let head = 0;
    let truncated = false;
    const rootNode = this.nodes.get(root);
    if (rootNode) nodesOut.push({ ...rootNode, depth: 0 });
    while (head < queue.length) {
      const cur = queue[head++];
      const d = depthOf.get(cur) ?? 0;
      if (d >= maxDepth) { truncated = true; continue; }
      for (const edge of this.outgoingOf(cur)) {
        edgesOut.push(edge);
        if (edge.to === null) continue;
        if (!depthOf.has(edge.to)) {
          if (nodesOut.length >= MAX_GRAPH_NODES) { truncated = true; continue; }
          depthOf.set(edge.to, d + 1);
          const n = this.nodes.get(edge.to);
          if (n) nodesOut.push({ ...n, depth: d + 1 });
          queue.push(edge.to);
        }
      }
    }
    return { root, nodes: nodesOut, edges: edgesOut, truncated };
  }
}

function pushEdge(map, key, edge) {
  const arr = map.get(key);
  if (arr) arr.push(edge); else map.set(key, [edge]);
}

/** Recursively collect `*_ref` / `*_refs` fields at any depth (dotted path). */
function collectRefs(value, path, emit) {
  if (value === null || typeof value !== 'object') return;
  if (Array.isArray(value)) {
    for (const item of value) collectRefs(item, path, emit);
    return;
  }
  for (const key of Object.keys(value)) {
    const v = value[key];
    const here = path ? path + '.' + key : key;
    if (isRefKey(key)) {
      if (typeof v === 'string') emit(here, v);
      else if (Array.isArray(v)) { for (const el of v) if (typeof el === 'string') emit(here, el); }
      else if (v && typeof v === 'object') collectRefs(v, here, emit);
    } else if (v && typeof v === 'object') {
      collectRefs(v, here, emit);
    }
  }
}

// ======================================================================
// columns — pick informative scalar columns per type. (Port of util/columns.ts.)
// ======================================================================

const BASE_SKIP = new Set([
  'name', 'uuid', 'tenant_ref', 'cloud_ref', 'url', 'configpb_attributes',
  '_last_modified', 'labels', 'markers',
]);
const PREFERRED = { type: 5, enabled: 4, is_federated: 2, os_type: 2, vrf: 2, ssl_profile_ref: 1 };
const MAX_COLUMNS = 4;

export function detectColumns(sample) {
  const present = {}, scalar = {};
  const n = Math.min(sample.length, 100);
  for (let i = 0; i < n; i++) {
    const o = sample[i];
    if (!o) continue;
    for (const k of Object.keys(o)) {
      if (BASE_SKIP.has(k)) continue;
      const v = o[k];
      present[k] = (present[k] ?? 0) + 1;
      if (isScalar(v) || (typeof v === 'string' && k.endsWith('_ref'))) scalar[k] = (scalar[k] ?? 0) + 1;
    }
  }
  const candidates = Object.keys(present).filter((k) => (scalar[k] ?? 0) >= (present[k] ?? 1) * 0.6);
  candidates.sort((a, b) => {
    const pa = PREFERRED[a] ?? 0, pb = PREFERRED[b] ?? 0;
    if (pb !== pa) return pb - pa;
    const sa = scalar[a] ?? 0, sb = scalar[b] ?? 0;
    if (sb !== sa) return sb - sa;
    return a.localeCompare(b);
  });
  return candidates.slice(0, MAX_COLUMNS);
}

export function cellValue(o, key) {
  const v = o[key];
  if (v === undefined || v === null) return null;
  if (typeof v === 'string') return key.endsWith('_ref') ? refName(v) : v;
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  if (Array.isArray(v)) return '[' + v.length + ']';
  if (typeof v === 'object') return '{…}';
  return String(v);
}

// ======================================================================
// dataset — the in-memory "store": one raw text slice per object, parsed on
// demand. Replaces SQLite + DuckDB + the REST layer. Sorting/filtering over
// 40k lightweight rows is ~10 ms; SQL was never the bottleneck.
// ======================================================================

export class Dataset {
  constructor() {
    this.graph = new RefGraph();
    this.raws = new Map();     // canonical uuid -> raw JSON slice
    this.meta = {};            // top-level non-array values (META, ...)
    this.fileName = '';
    this.bytes = 0;
    this.parseMs = 0;
    this.objectCount = 0;
    this._columns = new Map();     // type -> string[]
    this._colValues = new Map();   // type\0col -> Map(uuid -> string|null)
    this._inventory = null;
    this._hygiene = null;
    this._searchIndexPromise = null;
  }

  /** Parse a raw slice on demand. Returns {} for unknown uuids. */
  getObj(uuid) {
    const raw = this.raws.get(uuid);
    if (raw === undefined) return {};
    try { return JSON.parse(raw); } catch { return {}; }
  }
  getRaw(uuid) { return this.raws.get(uuid); }

  columnsFor(type) {
    let cols = this._columns.get(type);
    if (cols) return cols;
    const nodes = this.graph.allOfType(type);
    const sample = [];
    for (let i = 0; i < Math.min(nodes.length, 100); i++) sample.push(this.getObj(nodes[i].uuid));
    cols = detectColumns(sample);
    this._columns.set(type, cols);
    return cols;
  }

  /**
   * All values of one column for one type (for sorting). Built lazily; parses
   * every object of the type once, in chunks, yielding between chunks so a
   * 20k-object type cannot freeze the tab.
   */
  async columnValues(type, col) {
    const key = type + SEP + col;
    let m = this._colValues.get(key);
    if (m) return m;
    m = new Map();
    const nodes = this.graph.allOfType(type);
    for (let i = 0; i < nodes.length; i++) {
      m.set(nodes[i].uuid, cellValue(this.getObj(nodes[i].uuid), col));
      if (i % 2000 === 1999) await new Promise((r) => setTimeout(r, 0));
    }
    this._colValues.set(key, m);
    return m;
  }

  inventory() {
    if (this._inventory) return this._inventory;
    const byTenant = new Map(), byCloud = new Map();
    for (const node of this.graph.nodes.values()) {
      const t = node.tenant ?? '(none)', c = node.cloud ?? '(none)';
      byTenant.set(t, (byTenant.get(t) ?? 0) + 1);
      byCloud.set(c, (byCloud.get(c) ?? 0) + 1);
    }
    const toBuckets = (m) => [...m.entries()]
      .map(([key, count]) => ({ key, count }))
      .sort((a, b) => b.count - a.count || a.key.localeCompare(b.key));
    this._inventory = {
      total: this.graph.size,
      byType: this.graph.types(),
      byTenant: toBuckets(byTenant),
      byCloud: toBuckets(byCloud),
    };
    return this._inventory;
  }

  hygiene() {
    if (!this._hygiene) this._hygiene = runHygiene(this);
    return this._hygiene;
  }

  /**
   * Lazily built inverted search index, shared by every search over this
   * dataset. The build is deliberately NOT cancellable by an individual
   * search: it is a one-time O(config) investment, and cancelling it on
   * every superseded keystroke would restart it from scratch each time.
   */
  searchIndex(opts) {
    if (!this._searchIndexPromise) this._searchIndexPromise = buildSearchIndex(this, opts);
    return this._searchIndexPromise;
  }

  /** Version string from META, when present. */
  version() {
    const meta = this.meta.META;
    if (meta && typeof meta === 'object') {
      const v = meta.version;
      if (v && typeof v === 'object' && v.Version != null) return String(v.Version);
    }
    return null;
  }
}

/** Ingest a Blob/File into a Dataset. One pass: scan -> graph + raw slices. */
export async function ingestBlob(blob, fileName, onProgress) {
  const started = Date.now();
  const ds = new Dataset();
  ds.fileName = fileName;
  ds.bytes = blob.size;
  await scanBlob(blob, {
    onObject: (type, obj, slice) => {
      const uuid = ds.graph.addObject(type, obj);
      if (uuid !== null) { ds.raws.set(uuid, slice); ds.objectCount++; }
    },
    onMeta: (key, value) => { ds.meta[key] = value; },
  }, onProgress);
  ds.graph.resolve();
  ds.parseMs = Date.now() - started;
  return ds;
}

// ======================================================================
// hygiene — pure rules over (dataset, graph). Exact counts always; at most
// MAX_EXEMPLARS findings retained per rule so a partial export with 80k
// dangling refs produces a bounded report, not a frozen tab.
// ======================================================================

const EXPIRY_WARN_DAYS = 30;
const DEFAULT_CERT_NAMES = new Set(['System-Default-Cert', 'System-Default-Cert-EC']);
export const MAX_EXEMPLARS = 500;

export function runHygiene(ds) {
  const graph = ds.graph;
  const rules = new Map(); // ruleId -> {ruleId, severity, title, count, findings[]}

  const add = (ruleId, severity, title, subject, detail) => {
    let r = rules.get(ruleId);
    if (!r) { r = { ruleId, severity, title, count: 0, findings: [] }; rules.set(ruleId, r); }
    r.count++;
    if (r.findings.length < MAX_EXEMPLARS) r.findings.push({ ruleId, severity, title, subject, detail });
  };

  for (const node of graph.orphansOfType('Pool')) {
    add('orphaned-pool', 'warning', 'Orphaned pool', node,
      'Pool has no incoming references (no VirtualService, PoolGroup, or policy uses it).');
  }
  for (const node of graph.orphansOfType('PoolGroup')) {
    add('orphaned-poolgroup', 'warning', 'Orphaned pool group', node,
      'PoolGroup is not referenced by any VirtualService or policy.');
  }
  for (const node of graph.orphansOfType('HealthMonitor')) {
    add('unused-healthmonitor', 'info', 'Unused health monitor', node,
      'HealthMonitor is not attached to any pool.');
  }
  for (const node of graph.orphansOfType('SSLKeyAndCertificate')) {
    add('unused-certificate', 'info', 'Unused certificate', node,
      'Certificate is not referenced by any VirtualService or SSL profile.');
  }

  for (const node of graph.allOfType('VirtualService')) {
    const o = ds.getObj(node.uuid);
    if (getBool(o, 'enabled') === false) {
      add('disabled-virtualservice', 'info', 'Disabled virtual service', node,
        'VirtualService is administratively disabled (enabled=false).');
    }
    // ASSUMPTION: a VS "using" a cert exposes it via ssl_key_and_certificate_refs.
    const certRefs = o.ssl_key_and_certificate_refs;
    if (Array.isArray(certRefs)) {
      for (const ref of certRefs) {
        const name = refName(ref);
        if (name && DEFAULT_CERT_NAMES.has(name)) {
          add('default-certificate-in-use', 'warning', 'Default certificate in use', node,
            'VirtualService serves TLS with the built-in "' + name + '". Replace with a CA-signed certificate.');
        }
      }
    }
  }

  for (const node of graph.allOfType('SSLKeyAndCertificate')) {
    const o = ds.getObj(node.uuid);
    const notAfter = extractNotAfter(o);
    if (notAfter === null) continue;
    const ms = notAfter.getTime() - Date.now();
    const days = Math.floor(ms / 86_400_000);
    if (ms < 0) {
      add('expired-certificate', 'critical', 'Expired certificate', node,
        'Certificate expired ' + Math.abs(days) + ' day(s) ago (not_after ' + notAfter.toISOString() + ').');
    } else if (days <= EXPIRY_WARN_DAYS) {
      add('expiring-certificate', 'warning', 'Certificate expiring soon', node,
        'Certificate expires in ' + days + ' day(s) (not_after ' + notAfter.toISOString() + ').');
    }
  }

  for (const edge of graph.danglingEdges()) {
    const subject = graph.getNode(edge.from);
    if (!subject) continue;
    add('dangling-reference', 'critical', 'Dangling reference', subject,
      'Field "' + edge.field + '" points at ' + (edge.refName ? '"' + edge.refName + '"' : 'an object')
      + ' that is not present in this export.');
    if (rules.get('dangling-reference').count >= 1_000_000) break; // absolute backstop
  }

  const ruleList = [...rules.values()];
  const sevOrder = { critical: 0, warning: 1, info: 2 };
  ruleList.sort((a, b) => sevOrder[a.severity] - sevOrder[b.severity] || a.ruleId.localeCompare(b.ruleId));
  const countsBySeverity = { critical: 0, warning: 0, info: 0 };
  let total = 0;
  for (const r of ruleList) { countsBySeverity[r.severity] += r.count; total += r.count; }
  return { generatedAt: new Date().toISOString(), rules: ruleList, countsBySeverity, total };
}

/**
 * ASSUMPTION: SSLKeyAndCertificate carries certificate.not_after; Avi has used
 * both "2025-12-31 23:59:59" and ISO-8601 forms — Date parses both.
 */
function extractNotAfter(o) {
  const cert = o.certificate;
  if (!cert || typeof cert !== 'object') return null;
  const notAfter = cert.not_after;
  if (typeof notAfter !== 'string') return null;
  const d = new Date(notAfter);
  return Number.isNaN(d.getTime()) ? null : d;
}

// ======================================================================
// search — Google-style search over every object, backed by an inverted
// token index.
//
// Why an index: the naive approach (lowercase + substring-scan every raw
// slice per keystroke) is O(total config bytes) per query — seconds on a
// large export. Instead each raw slice is tokenized ONCE into an inverted
// index (token -> object ids). A query then scans only the vocabulary
// (deduped tokens, capped at MAX_TOKEN_LENGTH chars — orders of magnitude
// smaller than the corpus) and unions/intersects posting lists.
//
// Query semantics (deliberately forgiving):
//  - case-insensitive, literal — user input is never regex-compiled;
//  - the query splits into terms on any character outside [a-z0-9._-], so
//    "10.0.1.11:8080", '"addr": 10.0.1.11' and "10.0.1.11 8080" all mean
//    the same thing;
//  - terms are AND-ed: every term must appear somewhere in the object;
//  - a term matches as a substring of any token ("0.1.11" finds
//    "10.0.1.11"), and the object *type* name is indexed too.
//
// Exact totals and per-type facet counts always; at most
// MAX_SEARCH_RESULTS results retained (name matches prioritized), scored
// and snippeted only within that bounded set — the hygiene
// exact-count/capped-exemplars contract.
// ======================================================================

export const MAX_SEARCH_RESULTS = 500;
export const MIN_SEARCH_LENGTH = 2;
const MAX_SNIPPETS = 3;
const SNIPPET_CONTEXT = 44;
const FIELD_LOOKBACK = 220;
const MAX_COUNT_PER_OBJECT = 1000;
const MAX_TOKEN_LENGTH = 64;
const TOKEN_RE = /[a-z0-9][a-z0-9._-]*/g;

/** Split free-form user input into normalized AND-terms. */
export function tokenizeQuery(query) {
  return String(query).toLowerCase().match(TOKEN_RE) ?? [];
}

export class SearchIndex {
  constructor() {
    this.uuids = [];           // doc id -> canonical uuid
    this.postings = new Map(); // token -> doc id[] (ascending by construction)
    this.tokens = [];          // vocabulary snapshot, filled by finalize()
  }

  addDocument(uuid, tokenSet) {
    const id = this.uuids.length;
    this.uuids.push(uuid);
    for (const t of tokenSet) {
      const list = this.postings.get(t);
      if (list) list.push(id); else this.postings.set(t, [id]);
    }
  }

  finalize() { this.tokens = [...this.postings.keys()]; }

  /**
   * Doc ids of every object containing `term` as a substring of any token.
   * Scans the vocabulary, never the corpus; chunked + yielding.
   */
  async lookup(term, { isCancelled } = {}) {
    const out = new Set();
    for (let i = 0; i < this.tokens.length; i++) {
      if (i % 100_000 === 99_999) {
        await new Promise((r) => setTimeout(r, 0));
        if (isCancelled && isCancelled()) return null;
      }
      const tok = this.tokens[i];
      if (tok.includes(term)) for (const id of this.postings.get(tok)) out.add(id);
    }
    return out;
  }
}

/** Tokenize every raw slice once. Chunked + yielding; reports progress. */
export async function buildSearchIndex(ds, { onProgress } = {}) {
  const idx = new SearchIndex();
  const total = ds.raws.size;
  let i = 0;
  for (const [uuid, slice] of ds.raws) {
    if (i++ % 500 === 499) {
      await new Promise((r) => setTimeout(r, 0));
      if (onProgress) onProgress(i, total);
    }
    const node = ds.graph.getNode(uuid);
    if (!node) continue;
    const tokens = new Set();
    for (const t of slice.toLowerCase().match(TOKEN_RE) ?? []) {
      if (t.length <= MAX_TOKEN_LENGTH) tokens.add(t);
    }
    for (const t of node.type.toLowerCase().match(TOKEN_RE) ?? []) tokens.add(t);
    idx.addDocument(uuid, tokens);
  }
  idx.finalize();
  return idx;
}

function countMatches(hay, q, cap = MAX_COUNT_PER_OBJECT) {
  let n = 0, idx = hay.indexOf(q);
  while (idx !== -1 && n < cap) { n++; idx = hay.indexOf(q, idx + q.length); }
  return n;
}

function intersect(a, b) {
  const [small, big] = a.size <= b.size ? [a, b] : [b, a];
  const out = new Set();
  for (const v of small) if (big.has(v)) out.add(v);
  return out;
}

function countTermHits(name, terms) {
  const n = (name ?? '').toLowerCase();
  if (n === '') return 0;
  let hits = 0;
  for (const t of terms) if (n.includes(t)) hits++;
  return hits;
}

/**
 * Context snippets for `query` inside a raw JSON slice: up to `max` entries
 * of {field, before, match, after}. `field` is the nearest JSON key preceding
 * the match — a bounded regex lookback, not a parse; it degrades to null on
 * anything odd rather than throwing. `match` preserves the slice's original
 * casing.
 */
export function searchSnippets(raw, query, max = MAX_SNIPPETS) {
  const q = String(query).toLowerCase();
  if (q === '') return [];
  const hay = raw.toLowerCase();
  const out = [];
  let idx = hay.indexOf(q);
  while (idx !== -1 && out.length < max) {
    let field = null;
    const back = raw.slice(Math.max(0, idx - FIELD_LOOKBACK), idx);
    const keyRe = /"([^"\\]{1,64})"\s*:/g;
    let m;
    while ((m = keyRe.exec(back)) !== null) field = m[1];
    const start = Math.max(0, idx - SNIPPET_CONTEXT);
    const end = Math.min(raw.length, idx + q.length + SNIPPET_CONTEXT);
    out.push({
      field,
      before: (start > 0 ? '…' : '') + raw.slice(start, idx).replace(/\s+/g, ' '),
      match: raw.slice(idx, idx + q.length),
      after: raw.slice(idx + q.length, end).replace(/\s+/g, ' ') + (end < raw.length ? '…' : ''),
    });
    idx = hay.indexOf(q, idx + q.length);
  }
  return out;
}

/** Up to MAX_SNIPPETS snippets, spread across the query's terms. */
function resultSnippets(raw, terms) {
  const per = Math.max(1, Math.floor(MAX_SNIPPETS / terms.length));
  const out = [];
  for (const t of terms) {
    for (const s of searchSnippets(raw, t, per)) {
      if (out.length >= MAX_SNIPPETS) return out;
      out.push(s);
    }
  }
  return out;
}

/**
 * Search every object via the inverted index. Terms are AND-ed; an
 * optional `typeFilter` narrows results to one object type while `byType`
 * facet counts always describe the unfiltered candidate set. `total` is
 * exact; scoring and snippets are computed only for the retained (≤ limit)
 * results. `isCancelled` is checked at every yield point after the index
 * build (the build itself is shared and never restarted — see
 * Dataset.searchIndex).
 */
export async function searchDataset(ds, query, { limit = MAX_SEARCH_RESULTS, isCancelled, typeFilter = 'all', onProgress } = {}) {
  const trimmed = String(query).trim();
  const result = { query: trimmed, total: 0, results: [], byType: [], truncated: false, cancelled: false };
  if (trimmed.length < MIN_SEARCH_LENGTH) return result;
  const terms = tokenizeQuery(trimmed);
  if (terms.length === 0) return result;

  const index = await ds.searchIndex({ onProgress });
  if (isCancelled && isCancelled()) { result.cancelled = true; return result; }

  // AND the per-term candidate sets; early exit once empty.
  let candidates = null;
  for (const term of terms) {
    const ids = await index.lookup(term, { isCancelled });
    if (ids === null) { result.cancelled = true; return result; }
    candidates = candidates === null ? ids : intersect(candidates, ids);
    if (candidates.size === 0) break;
  }

  // One pass over candidates: facet counts (pre-filter), the filtered exact
  // total, and bounded retention with name matches prioritized.
  const byType = new Map();
  const named = [], rest = [];
  let i = 0;
  for (const id of candidates) {
    if (i++ % 5000 === 4999) {
      await new Promise((r) => setTimeout(r, 0));
      if (isCancelled && isCancelled()) { result.cancelled = true; return result; }
    }
    const node = ds.graph.getNode(index.uuids[id]);
    if (!node) continue;
    byType.set(node.type, (byType.get(node.type) ?? 0) + 1);
    if (typeFilter !== 'all' && node.type !== typeFilter) continue;
    result.total++;
    const nameHits = countTermHits(node.name, terms);
    if (nameHits > 0) { if (named.length < limit) named.push({ node, nameHits }); }
    else if (rest.length < limit) rest.push({ node, nameHits: 0 });
  }
  result.byType = [...byType.entries()].map(([key, count]) => ({ key, count }))
    .sort((a, b) => b.count - a.count || a.key.localeCompare(b.key));

  // Score + snippet only the retained results (bounded by `limit`).
  for (const r of named.concat(rest).slice(0, limit)) {
    const raw = ds.getRaw(r.node.uuid) ?? '';
    const low = raw.toLowerCase();
    let count = 0;
    for (const t of terms) count += countMatches(low, t);
    const typeHit = terms.some((t) => r.node.type.toLowerCase().includes(t));
    result.results.push({
      node: r.node,
      count,
      score: r.nameHits * 1_000_000 + count * 10 + (typeHit ? 1 : 0),
      snippets: count > 0 ? resultSnippets(raw, terms) : [],
    });
  }
  result.results.sort((a, b) => b.score - a.score
    || String(a.node.name ?? a.node.uuid).localeCompare(String(b.node.name ?? b.node.uuid)));
  result.truncated = result.total > result.results.length;
  return result;
}

// ======================================================================
// ui — everything below touches the DOM and only runs in a browser.
// ======================================================================

if (typeof document !== 'undefined' && document.getElementById('main')) boot();

function boot() {
  const $main = document.getElementById('main');
  const $tabs = document.getElementById('tabs');
  const $pipeline = document.getElementById('pipeline');
  const $btnNew = document.getElementById('btn-new');

  /** @type {Dataset|null} */
  let ds = null;
  let view = 'inventory';
  // Per-view UI state survives tab switches (feedback/consistency).
  const explorerState = { type: null, search: '', sort: 'name', dir: 'asc', page: 0, openUuid: null };
  const relState = { root: null, search: '' };
  const hygState = { severity: 'all', rule: 'all', page: 0 };
  const searchState = { query: '', page: 0, result: null, token: 0, typeFilter: 'all' };

  // ---- shell wiring ----
  $tabs.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    view = btn.dataset.view;
    for (const t of $tabs.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t === btn));
    render();
  });
  $btnNew.addEventListener('click', () => { ds = null; renderShell(); render(); });

  // "/" from anywhere jumps to search (unless already typing somewhere).
  document.addEventListener('keydown', (e) => {
    if (e.key !== '/' || !ds || e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    e.preventDefault();
    switchTo('search');
  });

  function renderShell() {
    $tabs.hidden = !ds;
    $btnNew.hidden = !ds;
    if (!ds) { $pipeline.textContent = 'No configuration loaded'; return; }
    const g = ds.graph;
    const ver = ds.version();
    $pipeline.innerHTML = '';
    $pipeline.append(
      el('span', {}, [ds.fileName + ' — ']),
      el('b', {}, [fmt(ds.objectCount)]), ' objects · ',
      el('b', {}, [fmt(g.edges)]), ' references · ',
      el('b', { style: g.dangling > 0 ? 'color: var(--err)' : '' }, [fmt(g.dangling)]), ' dangling',
      ver ? ' · v' + ver : '',
    );
  }

  function render() {
    $main.innerHTML = '';
    if (!ds) { $main.append(uploadView()); return; }
    if (view === 'inventory') $main.append(inventoryView());
    else if (view === 'explorer') $main.append(explorerView());
    else if (view === 'search') $main.append(searchView());
    else if (view === 'relationships') $main.append(relationshipsView());
    else if (view === 'hygiene') $main.append(hygieneView());
  }

  // ---- upload ----
  function uploadView() {
    const input = el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
    const zone = el('div', { class: 'dropzone', role: 'button', tabindex: '0', 'aria-label': 'Choose or drop an Avi configuration export' }, [
      el('div', { class: 'big' }, ['Drop an Avi configuration export here']),
      el('div', { class: 'muted' }, ['…or click to choose a file. This is the JSON export from the controller ("Export configuration"), the one shaped like {"VirtualService": […], "Pool": […]}.']),
    ]);
    const errBox = el('div', {});
    const wrap = el('div', { class: 'center-col' }, [
      zone, input, errBox,
      el('div', { class: 'privacy-note' }, [
        el('span', { class: 'lock', style: 'color:var(--ok)' }, ['\u{1F512}']),
        el('span', {}, ['Files are parsed in this tab and never uploaded — this page cannot make network requests.']),
      ]),
    ]);

    const start = (file) => { if (file) loadFile(file, wrap, zone, errBox); };
    zone.addEventListener('click', () => input.click());
    zone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    input.addEventListener('change', () => start(input.files[0]));
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault(); zone.classList.remove('drag');
      start(e.dataTransfer.files[0]);
    });
    return wrap;
  }

  async function loadFile(file, wrap, zone, errBox) {
    errBox.innerHTML = '';
    const bar = el('div', {});
    const label = el('div', { class: 'muted', role: 'status' }, ['Reading ' + file.name + '…']);
    const progress = el('div', { class: 'progress-wrap card' }, [
      label,
      el('div', { class: 'progress-bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100' }, [bar]),
    ]);
    zone.replaceWith(progress);
    const t0 = Date.now();
    try {
      const loaded = await ingestBlob(file, file.name, (read, total) => {
        const pct = total ? Math.round((read / total) * 100) : 0;
        bar.style.width = pct + '%';
        progress.querySelector('[role=progressbar]').setAttribute('aria-valuenow', String(pct));
        const mbs = read / 1e6 / Math.max(0.001, (Date.now() - t0) / 1000);
        label.textContent = 'Parsing ' + file.name + ' — ' + fmtMB(read) + ' of ' + fmtMB(total) + ' (' + mbs.toFixed(0) + ' MB/s)';
      });
      if (loaded.objectCount === 0) {
        throw Object.assign(new Error('no identified objects found — is this an Avi configuration export?'), { offset: 0 });
      }
      ds = loaded;
      explorerState.type = null; explorerState.page = 0; explorerState.openUuid = null; explorerState.search = '';
      relState.root = null; relState.search = '';
      hygState.severity = 'all'; hygState.rule = 'all'; hygState.page = 0;
      searchState.query = ''; searchState.page = 0; searchState.result = null; searchState.token++; searchState.typeFilter = 'all';
      view = 'inventory';
      for (const t of $tabs.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.view === 'inventory'));
      renderShell();
      render();
    } catch (err) {
      progress.replaceWith(zone);
      errBox.innerHTML = '';
      errBox.append(el('div', { class: 'error-box', role: 'alert' }, [
        el('div', {}, ['Could not read this file as an Avi configuration export. Nothing was changed — fix or re-export the file and drop it again.']),
        el('details', {}, [
          el('summary', {}, ['Technical detail']),
          el('div', { class: 'mono' }, [String(err.message) + (err.offset != null ? ' (near character ' + fmt(err.offset) + ')' : '')]),
        ]),
      ]));
    }
  }

  // ---- inventory ----
  function inventoryView() {
    const inv = ds.inventory();
    const wrap = el('div', {});
    const stats = el('div', { class: 'stat-row' }, [
      stat('Objects', fmt(inv.total)),
      stat('Types', String(inv.byType.length)),
      stat('Tenants', String(inv.byTenant.length)),
      stat('Clouds', String(inv.byCloud.length)),
      stat('References', fmt(ds.graph.edges)),
      stat('Dangling refs', fmt(ds.graph.dangling), ds.graph.dangling > 0 ? 'need attention' : 'clean'),
    ]);
    const ver = ds.version();
    if (ver) stats.append(stat('Version', ver));
    wrap.append(stats);

    const openType = (type) => {
      explorerState.type = type; explorerState.page = 0; explorerState.search = ''; explorerState.openUuid = null;
      switchTo('explorer');
    };

    wrap.append(el('div', { class: 'charts' }, [
      el('div', { class: 'card chart-card' }, [
        el('h3', {}, ['Objects by type', el('span', { class: 'faint' }, [' — click to explore'])]),
        treemapSvg(inv.byType, openType),
      ]),
      el('div', { class: 'card chart-card' }, [el('h3', {}, ['By tenant']), barsSvg(inv.byTenant)]),
      el('div', { class: 'card chart-card' }, [el('h3', {}, ['By cloud']), barsSvg(inv.byCloud)]),
    ]));
    return wrap;
  }

  function stat(k, v, sub) {
    return el('div', { class: 'stat' }, [
      el('div', { class: 'k' }, [k]),
      el('div', { class: 'v' }, [v, sub ? el('small', {}, [' ' + sub]) : '']),
    ]);
  }

  // ---- explorer ----
  function explorerView() {
    const inv = ds.inventory();
    if (explorerState.type === null) explorerState.type = inv.byType[0]?.key ?? null;
    const st = explorerState;

    const listPane = el('div', { class: 'card side-list' }, [
      el('div', { class: 'k', style: 'margin-bottom:8px' }, ['Object types']),
      ...inv.byType.map((t) => el('div', {
        class: 'item' + (st.type === t.key ? ' sel' : ''),
        onclick: () => { st.type = t.key; st.page = 0; st.openUuid = null; st.sort = 'name'; st.dir = 'asc'; render(); },
      }, [el('span', { class: 'mono' }, [t.key]), el('span', { class: 'muted' }, [fmt(t.count)])])),
    ]);

    const tablePane = el('div', { class: 'card' });
    const wrap = el('div', { class: 'split' }, [listPane, tablePane]);
    renderExplorerTable(tablePane);
    return wrap;
  }

  async function renderExplorerTable(pane) {
    const st = explorerState;
    if (!st.type) { pane.append(el('div', { class: 'muted' }, ['No object types found.'])); return; }
    const cols = ds.columnsFor(st.type);
    const fixedCols = ['name', 'uuid', 'tenant', 'cloud'];
    const allCols = [...fixedCols, ...cols];

    // Filter.
    let rows = ds.graph.allOfType(st.type);
    const total = rows.length;
    if (st.search) {
      const q = st.search.toLowerCase();
      rows = rows.filter((r) => (r.name ?? '').toLowerCase().includes(q) || r.uuid.toLowerCase().includes(q));
    }

    // Sort (fixed columns come from lightweight rows; detected columns from the
    // lazily built column cache, chunked so big types don't freeze the tab).
    const dirMul = st.dir === 'desc' ? -1 : 1;
    if (fixedCols.includes(st.sort)) {
      const k = st.sort;
      rows = rows.slice().sort((a, b) => dirMul * cmpVals(a[k], b[k]) || cmpVals(a.name, b.name));
    } else if (cols.includes(st.sort)) {
      const token = st.type + SEP + st.sort + SEP + st.dir;
      pane.dataset.sortToken = token;
      const values = await ds.columnValues(st.type, st.sort);
      if (pane.dataset.sortToken !== token || !pane.isConnected) return; // superseded
      rows = rows.slice().sort((a, b) => dirMul * cmpVals(values.get(a.uuid), values.get(b.uuid)) || cmpVals(a.name, b.name));
    }

    const PAGE = 50;
    const pages = Math.max(1, Math.ceil(rows.length / PAGE));
    if (st.page >= pages) st.page = pages - 1;
    const pageRows = rows.slice(st.page * PAGE, st.page * PAGE + PAGE);

    // Parse only the visible page for cell values.
    const cells = new Map();
    for (const r of pageRows) {
      const o = ds.getObj(r.uuid);
      cells.set(r.uuid, cols.map((c) => cellValue(o, c)));
    }

    pane.innerHTML = '';
    const searchInput = el('input', {
      type: 'search', placeholder: 'filter by name or uuid…', value: st.search,
      'aria-label': 'Filter ' + st.type + ' objects by name or uuid',
    });
    let debounce = 0;
    searchInput.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => { st.search = searchInput.value; st.page = 0; renderExplorerTable(pane); }, 150);
    });
    pane.append(el('div', { class: 'toolbar' }, [
      searchInput,
      el('span', { class: 'muted' }, [
        fmt(rows.length) + (rows.length !== total ? ' of ' + fmt(total) : '') + ' objects',
      ]),
    ]));

    const thead = el('tr', {}, allCols.map((c) => {
      const active = st.sort === c;
      return el('th', {
        scope: 'col',
        'aria-sort': active ? (st.dir === 'asc' ? 'ascending' : 'descending') : 'none',
        onclick: () => {
          if (st.sort === c) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
          else { st.sort = c; st.dir = 'asc'; }
          st.page = 0;
          renderExplorerTable(pane);
        },
      }, [c + (active ? (st.dir === 'asc' ? ' ▲' : ' ▼') : '')]);
    }));

    const tbody = el('tbody', {});
    for (const r of pageRows) {
      const tr = el('tr', { class: 'clickable', onclick: () => { st.openUuid = st.openUuid === r.uuid ? null : r.uuid; renderExplorerTable(pane); } }, [
        el('td', { class: 'name' }, [r.name ?? '—']),
        el('td', { class: 'mono', title: r.uuid }, [truncate(r.uuid, 34)]),
        el('td', { class: 'mono' }, [r.tenant ?? '—']),
        el('td', { class: 'mono' }, [r.cloud ?? '—']),
        ...cells.get(r.uuid).map((v) => el('td', { class: 'mono' }, [renderCellVal(v)])),
      ]);
      tbody.append(tr);
      if (st.openUuid === r.uuid) {
        tbody.append(el('tr', { class: 'detail-row' }, [
          el('td', { colspan: String(allCols.length) }, [detailPanel(r.uuid)]),
        ]));
      }
    }
    if (pageRows.length === 0) {
      tbody.append(el('tr', {}, [el('td', { colspan: String(allCols.length), class: 'muted', style: 'padding:24px' },
        ['No objects match' + (st.search ? ' “' + st.search + '”' : '') + '.'])]));
    }

    pane.append(el('div', { class: 'table-scroll' }, [el('table', {}, [el('thead', {}, [thead]), tbody])]));
    pane.append(el('div', { class: 'pager' }, [
      el('button', { class: 'btn', disabled: st.page === 0 ? '' : null, onclick: () => { st.page--; renderExplorerTable(pane); } }, ['‹ Prev']),
      el('span', {}, ['Page ' + (st.page + 1) + ' / ' + pages]),
      el('button', { class: 'btn', disabled: st.page + 1 >= pages ? '' : null, onclick: () => { st.page++; renderExplorerTable(pane); } }, ['Next ›']),
    ]));
  }

  function detailPanel(uuid) {
    const node = ds.graph.getNode(uuid);
    const raw = ds.getRaw(uuid);
    const outgoing = ds.graph.outgoingOf(uuid);
    const incoming = ds.graph.incomingOf(uuid);

    const edgeTarget = (uuidTo, label) => el('span', {
      class: 'mono edge-target', role: 'link', tabindex: '0',
      onclick: () => openObject(uuidTo),
      onkeydown: (e) => { if (e.key === 'Enter') openObject(uuidTo); },
    }, [label]);

    const left = el('div', {}, [
      el('div', { class: 'k', style: 'margin-bottom:6px' }, ['Outgoing references (' + outgoing.length + ')']),
      ...outgoing.slice(0, 200).map((e) => el('div', { class: 'edge-line' }, [
        el('span', { class: 'edge-field' }, [e.field]), ' → ',
        e.to
          ? edgeTarget(e.to, (ds.graph.getNode(e.to)?.name ?? e.refName ?? e.to))
          : el('span', { class: 'edge-dangling' }, ['⚠ ' + (e.refName ?? 'unresolved') + ' (dangling)']),
      ])),
      outgoing.length > 200 ? el('div', { class: 'faint' }, ['… ' + (outgoing.length - 200) + ' more']) : '',
      el('div', { class: 'k', style: 'margin:10px 0 6px' }, ['Referenced by (' + incoming.length + ')']),
      ...incoming.slice(0, 200).map((e) => el('div', { class: 'edge-line' }, [
        edgeTarget(e.from, (ds.graph.getNode(e.from)?.name ?? e.from)),
        ' ', el('span', { class: 'edge-field' }, ['(' + e.field + ')']),
      ])),
      incoming.length > 200 ? el('div', { class: 'faint' }, ['… ' + (incoming.length - 200) + ' more']) : '',
      el('div', { style: 'margin-top:10px' }, [
        el('button', { class: 'btn', onclick: () => { relState.root = uuid; switchTo('relationships'); } }, ['View dependency graph']),
      ]),
    ]);
    return el('div', { class: 'detail-grid' }, [left, jsonPre(raw, node)]);
  }

  /** Jump the explorer to one specific object and open its detail row. */
  function openObject(uuid) {
    const node = ds.graph.getNode(uuid);
    if (!node) return;
    explorerState.type = node.type;
    explorerState.search = '';
    explorerState.sort = 'name'; explorerState.dir = 'asc';
    explorerState.openUuid = node.uuid;
    const rows = ds.graph.allOfType(node.type).slice().sort((a, b) => cmpVals(a.name, b.name));
    const idx = rows.findIndex((r) => r.uuid === node.uuid);
    explorerState.page = idx >= 0 ? Math.floor(idx / 50) : 0;
    switchTo('explorer');
  }

  function switchTo(v) {
    view = v;
    for (const t of $tabs.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.view === v));
    render();
  }

  // ---- global search ----
  function searchView() {
    const st = searchState;
    const input = el('input', {
      type: 'search', value: st.query,
      placeholder: 'Search anything — combine words to narrow: 10.0.1.11 8080',
      'aria-label': 'Search all objects',
    });
    const resultsBox = el('div', {});
    let debounce = 0;
    const commit = () => {
      st.query = input.value; st.page = 0; st.typeFilter = 'all';
      runSearch(resultsBox);
    };
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(commit, 250);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { clearTimeout(debounce); commit(); }
    });
    const wrap = el('div', {}, [el('div', { class: 'search-head' }, [input]), resultsBox]);

    const trimmed = st.query.trim();
    if (trimmed.length >= MIN_SEARCH_LENGTH && (!st.result || st.result.query !== trimmed)) runSearch(resultsBox);
    else renderSearchResults(resultsBox);
    setTimeout(() => { if (input.isConnected) input.focus(); }, 0);
    return wrap;
  }

  async function runSearch(box) {
    const st = searchState;
    const token = ++st.token;
    const q = st.query.trim();
    if (q.length < MIN_SEARCH_LENGTH) { st.result = null; renderSearchResults(box); return; }
    const status = el('div', { class: 'muted search-hint', role: 'status' }, ['Searching…']);
    box.innerHTML = '';
    box.append(status);
    const res = await searchDataset(ds, q, {
      typeFilter: st.typeFilter,
      isCancelled: () => st.token !== token || !box.isConnected,
      onProgress: (done, total) => {
        status.textContent = 'Indexing ' + fmt(total) + ' objects — '
          + Math.round((done / Math.max(1, total)) * 100) + '% (one-time; every later search is instant)';
      },
    });
    if (st.token !== token || res.cancelled) return;
    st.result = res;
    st.page = 0;
    renderSearchResults(box);
  }

  /** Clickable "Used by" / "References" links so associations are one hop away. */
  function assocLine(label, uuids) {
    const uniq = [...new Set(uuids)];
    if (uniq.length === 0) return '';
    const children = [el('span', { class: 'k2' }, [label])];
    uniq.slice(0, 3).forEach((u, i) => {
      const n = ds.graph.getNode(u);
      if (i > 0) children.push(', ');
      children.push(el('span', {
        class: 'edge-target', role: 'link', tabindex: '0',
        onclick: () => openObject(u),
        onkeydown: (e) => { if (e.key === 'Enter') openObject(u); },
      }, [(n?.name ?? u) + (n ? ' (' + n.type + ')' : '')]));
    });
    if (uniq.length > 3) children.push(el('span', { class: 'faint' }, [' +' + fmt(uniq.length - 3) + ' more']));
    return el('div', { class: 'assoc' }, children);
  }

  function renderSearchResults(box) {
    const st = searchState;
    box.innerHTML = '';
    if (st.query.trim().length < MIN_SEARCH_LENGTH) {
      box.append(el('div', { class: 'muted search-hint' }, [
        'Every object’s full JSON is searched — an IP, a port, a name, a uuid fragment. '
        + 'Combine words to narrow down: “10.0.1.11 8080” finds objects containing both. '
        + 'Press / from any tab to jump here.',
      ]));
      return;
    }
    const res = st.result;
    if (!res || res.query !== st.query.trim()) return; // search in flight

    // Type facets — always shown from the unfiltered candidate set.
    const facetTotal = res.byType.reduce((s, b) => s + b.count, 0);
    if (facetTotal > 0 && (res.byType.length > 1 || st.typeFilter !== 'all')) {
      const chip = (label, key, count) => el('button', {
        class: 'facet' + (st.typeFilter === key ? ' active' : ''),
        onclick: () => { st.typeFilter = key; st.page = 0; runSearch(box); },
      }, [label + ' (' + fmt(count) + ')']);
      box.append(el('div', { class: 'facets' }, [
        chip('All', 'all', facetTotal),
        ...res.byType.map((b) => chip(b.key, b.key, b.count)),
      ]));
    }

    if (res.total === 0) {
      box.append(el('div', { class: 'muted search-hint' }, [
        'No objects contain “' + res.query + '”'
        + (st.typeFilter !== 'all' ? ' in ' + st.typeFilter : '') + '.',
      ]));
      return;
    }

    box.append(el('div', { class: 'muted search-status', role: 'status' }, [
      fmt(res.total) + ' object' + (res.total === 1 ? '' : 's') + ' match “' + res.query + '”'
      + (st.typeFilter !== 'all' ? ' in ' + st.typeFilter : '')
      + (res.truncated ? ' — showing the top ' + fmt(res.results.length) : ''),
    ]));

    const PAGE = 20;
    const pages = Math.max(1, Math.ceil(res.results.length / PAGE));
    if (st.page >= pages) st.page = pages - 1;
    const pageResults = res.results.slice(st.page * PAGE, st.page * PAGE + PAGE);

    for (const r of pageResults) {
      const n = r.node;
      const usedBy = ds.graph.incomingOf(n.uuid).map((e) => e.from);
      const references = ds.graph.outgoingOf(n.uuid)
        .filter((e) => e.to !== null && e.field !== 'tenant_ref' && e.field !== 'cloud_ref')
        .map((e) => e.to);
      box.append(el('div', { class: 'card result' }, [
        el('div', { class: 'result-title' }, [
          el('span', {
            class: 'edge-target', role: 'link', tabindex: '0',
            onclick: () => openObject(n.uuid),
            onkeydown: (e) => { if (e.key === 'Enter') openObject(n.uuid); },
          }, [n.name ?? n.uuid]),
          el('span', { class: 'result-type mono' }, [n.type]),
          n.tenant ? el('span', { class: 'muted' }, ['tenant ' + n.tenant]) : '',
          n.cloud ? el('span', { class: 'muted' }, ['cloud ' + n.cloud]) : '',
        ]),
        ...r.snippets.map((s) => el('div', { class: 'snippet mono' }, [
          s.field ? el('span', { class: 'edge-field' }, [s.field + ': ']) : '',
          s.before,
          el('mark', { class: 'hl' }, [s.match]),
          s.after,
        ])),
        r.count > r.snippets.length ? el('div', { class: 'faint' }, [fmt(r.count) + ' matches in this object']) : '',
        r.count === 0 ? el('div', { class: 'faint' }, ['Matches the object type name.']) : '',
        assocLine('Used by', usedBy),
        assocLine('References', references),
      ]));
    }

    if (pages > 1) {
      box.append(el('div', { class: 'pager', style: 'max-width:860px; margin:0 auto' }, [
        el('button', { class: 'btn', disabled: st.page === 0 ? '' : null, onclick: () => { st.page--; renderSearchResults(box); } }, ['‹ Prev']),
        el('span', {}, ['Page ' + (st.page + 1) + ' / ' + pages]),
        el('button', { class: 'btn', disabled: st.page + 1 >= pages ? '' : null, onclick: () => { st.page++; renderSearchResults(box); } }, ['Next ›']),
      ]));
    }
  }

  // ---- relationships ----
  const TYPE_COLORS = {
    VirtualService: '#6366f1', VsVip: '#0ea5e9', Pool: '#10b981', PoolGroup: '#059669',
    HealthMonitor: '#d97706', ServiceEngineGroup: '#8b5cf6', SSLKeyAndCertificate: '#ef4444',
    ApplicationProfile: '#eab308', NetworkProfile: '#f97316', Tenant: '#64748b', Cloud: '#475569',
  };
  const typeColor = (t) => TYPE_COLORS[t] ?? '#7c8db0';

  function relationshipsView() {
    const st = relState;
    const vsNodes = ds.graph.allOfType('VirtualService').slice().sort((a, b) => cmpVals(a.name, b.name));
    if (st.root === null) st.root = vsNodes[0]?.uuid ?? null;

    let debounce = 0;

      }, [el('span', {}, [truncate(n.name ?? n.uuid, 26)])])),
      filtered.length > 2000 ? el('div', { class: 'faint', style: 'padding:4px 8px' }, ['… ' + fmt(filtered.length - 2000) + ' more — narrow the filter']) : '',
    ]);

    const canvasPane = el('div', { class: 'card' });

    } else {
